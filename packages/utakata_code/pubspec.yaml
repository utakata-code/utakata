version: 1.8.0
homepage: https://github.com/utakata-code/utakata
repository: https://github.com/utakata-code/utakata

environment:
  sdk: ">=3.0.0 <4.0.0"

executables:
  utakata: utakata

dependencies:
  args: ^2.6.0
  yaml: ^3.1.0
  yaml_edit: ^2.2.0
  path: ^1.9.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.0
